<script>
// ============================================================

// Añade data-i18n="clave" a cualquier texto nuevo y su traducción aquí abajo.
// ============================================================
window.OBA_PAGE_LANG = 'en';
window.OBA_TRANSLATIONS = window.OBA_TRANSLATIONS || {
  es: {
    h1_seo: "oba-, restaurante con Estrella Michelin y Estrella Verde en Casas-Ibáñez, Albacete",
    menu_reserva: "RESERVA", menu_contacto: "CONTACTO", menu_tienda: "TIENDA",

    btn_reservar: "RESERVAR",
    aria_menu: "Abrir menú", aria_lang: "Seleccionar idioma"
  },
  en: {
    h1_seo: "oba-, Michelin-starred and Green Star restaurant in Casas-Ibáñez, Albacete",
    menu_reserva: "BOOK", menu_contacto: "CONTACT", menu_tienda: "SHOP",
    nav_restaurante: "RESTAURANT", nav_entorno: "SURROUNDINGS", nav_nosotros: "ABOUT US",
    btn_reservar: "BOOK NOW",
    aria_menu: "Open menu", aria_lang: "Select language"
  }
};

function obaApplyLang(lang) {
  const dict = window.OBA_TRANSLATIONS[lang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.dataset.i18n;
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
    el.dataset.i18nAttr.split(';').forEach((pair) => {
      const [attr, key] = pair.split(':').map(s => s.trim());
      if (attr && dict[key] !== undefined) el.setAttribute(attr, dict[key]);
    });
  });
  document.querySelectorAll('.oba-lang-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang;
  try { localStorage.setItem('oba_lang', lang); } catch (e) {}
}

function obaInit() {
  let saved = 'es';
  saved = window.OBA_PAGE_LANG || 'es';
  obaApplyLang(saved);

  document.querySelectorAll('.oba-lang-btn').forEach((btn) => {
    btn.addEventListener('click', () => obaApplyLang(btn.dataset.lang));
  });

  var menuBtn = document.querySelector('.oba-page .oba-menu-btn');
  var inlineMenu = document.querySelector('.oba-page #oba-inline-menu');
  if (menuBtn && inlineMenu) {
    menuBtn.addEventListener('click', function () {
      var isOpen = inlineMenu.classList.toggle('open');
      menuBtn.classList.toggle('active', isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
    });
  }

  var links = document.querySelectorAll('.oba-page .oba-hero-link');
  var layers = document.querySelectorAll('.oba-page .oba-bg-layer');
  var nav = document.querySelector('.oba-page .oba-hero-nav');
  var DEFAULT_BG = 'bg-default';
  function showBg(targetId) {
    layers.forEach(function (layer) { layer.classList.remove('active'); });
    var target = document.getElementById(targetId);
    if (target) target.classList.add('active');
  }
  links.forEach(function (link) {
    var targetId = link.dataset.bg;
    link.addEventListener('mouseenter', function () { showBg(targetId); });
    link.addEventListener('focus', function () { showBg(targetId); });
  });
  if (nav) {
    nav.addEventListener('mouseleave', function () { showBg(DEFAULT_BG); });
    nav.addEventListener('focusout', function (e) {
      if (!nav.contains(e.relatedTarget)) showBg(DEFAULT_BG);
    });
  }

  // En móvil no hay hover: las fotos van rotando solas cada ~2s
  if (layers.length) {
    var bgIds = Array.prototype.map.call(layers, function (layer) { return layer.id; });
    var mobileQuery = window.matchMedia('(max-width: 700px)');
    var carouselTimer = null;
    var carouselIndex = 0;
    function startCarousel() {
      if (carouselTimer || bgIds.length < 2) return;
      carouselIndex = bgIds.indexOf(DEFAULT_BG);
      if (carouselIndex < 0) carouselIndex = 0;
      carouselTimer = setInterval(function () {
        carouselIndex = (carouselIndex + 1) % bgIds.length;
        showBg(bgIds[carouselIndex]);
      }, 2000);
    }
    function stopCarousel() {
      if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
      showBg(DEFAULT_BG);
    }
    mobileQuery.addEventListener('change', function (e) {
      if (e.matches) startCarousel(); else stopCarousel();
    });
    if (mobileQuery.matches) startCarousel();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', obaInit);
} else {
  obaInit();
}

// AVISO DE COOKIES + GOOGLE ANALYTICS — cada página lleva su propia copia.
// Solo carga Analytics si el usuario pulsa "Aceptar" (nunca antes).
// ============================================================
(function () {
  var KEY = 'oba_cookie_consent';

  // Sustituir por el ID de medición real de Google Analytics (GA4),
  // formato "G-XXXXXXXXXX", en TODAS las páginas cuando esté disponible.
  var GA_MEASUREMENT_ID = 'G-569C4M80ZY';

  function getConsent() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function setConsent(value) {
    try { localStorage.setItem(KEY, value); } catch (e) {}
  }

  function loadAnalytics() {
    if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID.indexOf('XXXX') !== -1) return;
    // Sin Analytics para usuarios conectados a WordPress (como hacía Site Kit)
    if (document.body && document.body.classList.contains('logged-in')) return;
    if (window.__obaGaLoaded) return;
    window.__obaGaLoaded = true;
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', GA_MEASUREMENT_ID, { anonymize_ip: true });
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
    document.head.appendChild(script);
  }

  function texts() {
    var lang = 'es';
    try { lang = (window.OBA_PAGE_LANG || document.documentElement.lang || 'es').slice(0, 2); } catch (e) {}
    if (lang === 'en') {
      return {
        text: 'We use our own technical cookies to remember your language and keep the site working properly, and — only if you accept — Google Analytics to measure site usage. You can accept, reject non-essential cookies, or read more in our ',
        link: 'Cookie Policy',
        accept: 'Accept',
        reject: 'Reject non-essential'
      };
    }
    return {
      text: 'Usamos cookies propias y técnicas para recordar tu idioma y que la web funcione correctamente y, solo si las aceptas, Google Analytics para medir el uso del sitio. Puedes aceptarlas, rechazar las no esenciales o leer más en nuestra ',
      link: 'Política de Cookies',
      accept: 'Aceptar',
      reject: 'Rechazar no esenciales'
    };
  }

  function buildBanner() {
    var t = texts();
    var wrap = document.createElement('div');
    wrap.className = 'oba-cookie-banner';
    wrap.setAttribute('role', 'region');
    wrap.setAttribute('aria-label', 'Cookie notice');
    wrap.innerHTML =
      '<p class="oba-cookie-text">' + t.text + '<a href="/cookies">' + t.link + '</a>.</p>' +
      '<div class="oba-cookie-actions">' +
        '<button type="button" class="oba-cookie-btn oba-cookie-btn--ghost" data-action="reject">' + t.reject + '</button>' +
        '<button type="button" class="oba-cookie-btn" data-action="accept">' + t.accept + '</button>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.querySelector('[data-action="accept"]').addEventListener('click', function () {
      setConsent('accepted');
      loadAnalytics();
      wrap.remove();
    });
    wrap.querySelector('[data-action="reject"]').addEventListener('click', function () {
      setConsent('rejected');
      wrap.remove();
    });
  }

  function initCookies() {
    var consent = getConsent();
    if (!consent) {
      buildBanner();
    } else if (consent === 'accepted') {
      loadAnalytics();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCookies);
  } else {
    initCookies();
  }
})();
</script>
